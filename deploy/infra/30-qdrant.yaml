# Qdrant 向量库 —— RAG 检索层
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  namespace: kaiops
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: kaiops
spec:
  replicas: 1
  strategy:
    type: Recreate # 有状态：与 MySQL 同理，见 deploy/infra/11-mysql.yaml 的注释
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      containers:
        - name: qdrant
          image: docker.io/qdrant/qdrant:v1.12.4
          ports:
            - containerPort: 6333 # HTTP API（应用只用这个）
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet:
              path: /healthz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: kaiops
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
      targetPort: 6333
