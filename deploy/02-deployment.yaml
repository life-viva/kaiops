apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaiops-chat
  namespace: kaiops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kaiops-chat
  template:
    metadata:
      labels:
        app: kaiops-chat
    spec:
      containers:
        - name: chat
          image: docker.io/library/kaiops-chat:v0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: llm-secret
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
